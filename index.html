<style>

  #joy i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 4px 14px rgba(0,0,0,.15); }

<body>

</div>

<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// === CONFIG ===
const CONFIG = {
  seed: 11,
  islandRadius: 42,
  hill: { x: -9, z: -10, height: 10, spread: 12 },
  colors: {
    skyTop: '#2b86d8', skyHorizon: '#bfe5f3', sunGlow: '#fff2cf', sunLight: '#fff1d8',
    deepWater: '#1380b8', shallowWater: '#33d4c5', foam: '#ffffff',
    sand: '#f6dba2', wetSand: '#d9b97e', grass: '#7bba57', grassDark: '#5a9e48', hillTop: '#6aa04c', rock: '#aaa093',
    trunk: '#9b6a44', palmLeaf: '#47a94a', treeLeaf: '#6cbd4e', wood: '#b47b4c', roof: '#e8bf6c',
    player: '#ff8a78', shellIn: '#ff8d78', shellOut: '#fff1e6', beam: '#ffe49a',
    flowers: ['#ff8fb1', '#ffd45c', '#ffffff', '#ff9f6b', '#c9a7ff'],

  counts: { palms: 24, trees: 24, flowers: 200, grass: 420, rocks: 28, clouds: 14, birds: 6, motes: 40 },
  shells: 7,
  player: { speed: 6.5, waterSpeed: 0.6, accel: 10, jump: 7.6, gravity: 22, deepWater: -0.6, radius: 0.45 },
  camera: { distance: 10, minDistance: 5, maxDistance: 20, pitch: 0.32, fov: 50, lookUp: 2.1 },

const C = CONFIG.colors;
const orb = window.orb;

// Deterministic helpers: same seed => same island, so saved shells stay where they were.
let seed = CONFIG.seed;
const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rand();
const hash = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, z) {

const fbm = (x, z) => { let s = 0, a = 0.5; for (let i = 0; i < 4; i++) { s += a * vnoise(x, z); x *= 2.03; z *= 2.03; a *= 0.5; } return s; };

// Island height at any point: sandy ring -> grass plateau -> gentle hill; sea level is y = 0.
function heightAt(x, z) {

  const r = Math.hypot(x, z) / (R * (0.8 + 0.4 * fbm(Math.cos(ang) * 1.3 + 3.1, Math.sin(ang) * 1.3 + 7.7)));
  const inland = 1 - smooth(0.45, 0.95, r);

  h += hl.height * Math.exp(-((x - hl.x) ** 2 + (z - hl.z) ** 2) / (2 * hl.spread ** 2)) * inland;

// === SCENE ===
const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(C.skyHorizon, 120, 440);
const camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, innerWidth / innerHeight, 0.1, 1600);
const timer = new THREE.Timer(); timer.connect(document);
const uTime = { value: 0 };
const dummy = new THREE.Object3D(), tmpColor = new THREE.Color(), tmpV = new THREE.Vector3();
function canvasTexture(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return new THREE.CanvasTexture(c); }
const radialTex = canvasTexture(64, 64, (g, w) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#000'); g.fillStyle = gr; g.fillRect(0, 0, w, w); });

// === SKY & LIGHT ===
const sunDir = new THREE.Vector3(0.5, 0.62, 0.6).normalize();
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(C.skyTop) }, horizon: { value: new THREE.Color(C.skyHorizon) }, glow: { value: new THREE.Color(C.sunGlow) }, sunDir: { value: sunDir } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 top, horizon, glow, sunDir; varying vec3 vDir;
    void main(){ vec3 d = normalize(vDir); vec3 c = mix(horizon, top, pow(max(d.y, 0.0), 0.38));

      #include <colorspace_fragment>

scene.add(sky);
scene.add(new THREE.HemisphereLight('#d2efff', '#e8d3a2', 1.25));
const sun = new THREE.DirectionalLight(C.sunLight, 2.7);

sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 160 });
Object.assign(sun.shadow, { bias: -0.0004, normalBias: 0.05, radius: 3 });
scene.add(sun, sun.target);

// Puffy clouds drifting overhead (one instanced mesh)
const cloudParts = [];
for (let i = 0; i < 7; i++) cloudParts.push(new THREE.IcosahedronGeometry(rr(2.6, 4.6), 1).translate((i - 3) * 2.6 + rr(-1, 1), rr(-0.4, 1.4), rr(-2, 2)));

// === WORLD ===
const R = CONFIG.islandRadius, SIZE = R * 3.6, SEG = 128, CELL = SIZE / SEG;
// --- terrain: flat-shaded low-poly heightfield, one color per triangle
const tg = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG).rotateX(-Math.PI / 2).toNonIndexed();
{
  const p = tg.attributes.position, cols = new Float32Array(p.count * 3), a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {

    const h = (a.y + b.y + c.y) / 3, slope = b.sub(a).cross(c.sub(a)).normalize().y, n = fbm(a.x * 0.12, a.z * 0.12);
    if (h < -0.15) tmpColor.set(C.wetSand);
    else if (h < 0.85) tmpColor.set(C.sand);
    else if (h < 1.05) tmpColor.set(C.sand).lerp(tmpColor.clone().set(C.grass), 0.6);
    else tmpColor.set(n > 0.5 ? C.grassDark : C.grass).lerp(tmpColor.clone().set(C.hillTop), smooth(5, 11, h));

    tmpColor.offsetHSL(0, 0, (hash(a.x, a.z) - 0.5) * 0.05);
    for (let k = 0; k < 3; k++) cols.set([tmpColor.r, tmpColor.g, tmpColor.b], (i + k) * 3);
  }

}
const terrain = new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }));
terrain.receiveShadow = true;
scene.add(terrain);

// --- ocean: faceted waves, depth-tinted (turquoise shallows), shore foam and sun glitter
const DT = 256, depthData = new Uint8Array(DT * DT);

const depthTex = new THREE.DataTexture(depthData, DT, DT, THREE.RedFormat);
depthTex.magFilter = depthTex.minFilter = THREE.LinearFilter; depthTex.needsUpdate = true;
const wg = new THREE.PlaneGeometry(2, 2, 160, 160).rotateX(-Math.PI / 2);
for (let i = 0, p = wg.attributes.position; i < p.count; i++) { const u = p.getX(i), v = p.getZ(i); p.setX(i, 800 * (0.2 * u + 0.8 * u ** 3)); p.setZ(i, 800 * (0.2 * v + 0.8 * v ** 3)); }
const waterMat = new THREE.ShaderMaterial({
  transparent: true, fog: true,
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uDepth: { value: null }, uSize: { value: SIZE }, uDeep: { value: new THREE.Color(C.deepWater) }, uShallow: { value: new THREE.Color(C.shallowWater) }, uFoam: { value: new THREE.Color(C.foam) }, uSky: { value: new THREE.Color(C.skyHorizon) }, uSunDir: { value: sunDir } }]),
  vertexShader: `#include <fog_pars_vertex>
    uniform float uTime; varying vec3 vW;
    void main(){ vec3 p = position;

  fragmentShader: `#include <fog_pars_fragment>
    uniform float uTime, uSize; uniform sampler2D uDepth; uniform vec3 uDeep, uShallow, uFoam, uSky, uSunDir; varying vec3 vW;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

      #include <colorspace_fragment>
      #include <fog_fragment>
    }`,

scene.add(new THREE.Mesh(wg, waterMat));

// --- shared helpers for props
function painted(geo, hex) { // non-indexed geometry with a flat vertex color, ready to merge

}
function swayMaterial(extra = {}) { // foliage bends in the breeze (vertex shader, per-instance phase)
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.85, ...extra });
  m.onBeforeCompile = (s) => {
    s.uniforms.uTime = uTime;
    s.vertexShader = 'uniform float uTime;\n' + s.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>

}
const obstacles = [];   // circles the player bumps into: {x, z, r}
const placed = [];      // keeps props from overlapping
function scatter(n, test, gap, block = true) {
  const out = [];
  for (let k = 0; k < n * 60 && out.length < n; k++) {
    const x = rr(-R * 1.3, R * 1.3), z = rr(-R * 1.3, R * 1.3), h = heightAt(x, z);

function instanced(geo, mat, items, setup, shadow = true) {

}

// --- dock + hut (merged, vertex colored)
const dockDir = new THREE.Vector2(Math.cos(CONFIG.dockAngle), Math.sin(CONFIG.dockAngle));
let dockR = 5; while (heightAt(dockDir.x * dockR, dockDir.y * dockR) > 0.35) dockR += 0.25;
const dock = { x: dockDir.x * (dockR - 1.5), z: dockDir.y * (dockR - 1.5), len: 13, w: 2.2, top: 0.62 };
{
  const parts = [];
  for (let i = 0; i < 22; i++) parts.push(painted(new THREE.BoxGeometry(dock.w + rr(-0.1, 0.15), 0.14, 0.52).rotateY(rr(-0.03, 0.03)).translate(rr(-0.05, 0.05), dock.top - 0.07, i * 0.6 + 0.3), i % 3 ? C.wood : '#a46d43'));

  const dockMesh = new THREE.Mesh(mergeGeometries(parts), new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9 }));
  dockMesh.position.set(dock.x, 0, dock.z); dockMesh.rotation.y = Math.atan2(dockDir.x, dockDir.y);
  dockMesh.castShadow = dockMesh.receiveShadow = true; scene.add(dockMesh);
  for (let i = 0; i < 6; i++) placed.push({ x: dock.x + dockDir.x * i * 2.5, z: dock.z + dockDir.y * i * 2.5, r: 2 });
}
const onDock = (x, z) => { const dx = x - dock.x, dz = z - dock.z, along = dx * dockDir.x + dz * dockDir.y, across = -dx * dockDir.y + dz * dockDir.x; return along > -0.4 && along < dock.len && Math.abs(across) < dock.w / 2; };
const side = new THREE.Vector2(-dockDir.y, dockDir.x);
const hut = { x: dockDir.x * (dockR - 10) + side.x * 6, z: dockDir.y * (dockR - 10) + side.y * 6 };
hut.h = heightAt(hut.x, hut.z);

  } else { pos.x = nx; pos.z = nz; }
  const ground = groundAt(pos.x, pos.z);
  if (wantJump && state.grounded) { state.vy = P.jump; state.grounded = false; state.squashV += 6; sfx.jump(); }
  wantJump = false;
  if (!state.grounded) {
    state.vy -= P.gravity * dt; pos.y += state.vy * dt;
    if (pos.y <= ground) { pos.y = ground; state.grounded = true; state.squashV -= Math.min(9, Math.abs(state.vy) * 0.8); if (ground < 0) burst(pos.x, 0.1, pos.z, 12, ['#ffffff', '#c9f6ff'], 3); }
  } else { pos.y += (ground - pos.y) * Math.min(1, dt * 16); if (ground - pos.y > 0.4) pos.y = ground; if (ground < pos.y - 0.8) state.grounded = false, state.vy = 0; }
  const spd = Math.hypot(v.x, v.z);
  if (spd > 0.4) state.facing = angleLerp(state.facing, Math.atan2(v.x, v.z), Math.min(1, dt * 12));
  player.rotation.y = state.facing;
  // squash & stretch spring + walk cycle
  state.squashV += (-140 * state.squash - 12 * state.squashV) * dt; state.squash += state.squashV * dt;
  const walkAmt = stepBuddy(me, spd, dt, state.grounded);
  const breathe = Math.sin(t * 2.6) * 0.015 * (1 - walkAmt), sq = state.squash * 0.12;
  rig.scale.set(1 - sq * 0.5 - breathe * 0.5, 1 + sq + breathe, 1 - sq * 0.5);
  blob.position.set(pos.x, ground + 0.04, pos.z); blob.scale.setScalar(Math.max(0.4, 1 - (pos.y - ground) * 0.15));
}
function updateCamera(dt) {
  const k = Math.min(1, dt * (cam.intro ? 1.1 : 6)); cam.dist += (cam.distGoal - cam.dist) * k; // intro swoop, then smooth zoom
  if (cam.intro) { cam.pitch += (CONFIG.camera.pitch - cam.pitch) * k; cam.yaw += (cam.yaw0 - cam.yaw) * k; if (Math.abs(cam.yaw0 - cam.yaw) < 0.01) cam.intro = false; }
  look.lerp(tmpV.set(player.position.x, player.position.y + CONFIG.camera.lookUp, player.position.z), 1 - Math.exp(-dt * 10));
  const cp = Math.cos(cam.pitch), ux = Math.sin(cam.yaw), uz = Math.cos(cam.yaw);
  let d = cam.dist * (camera.aspect < 0.8 ? 1.15 : 1);
  for (const o of obstacles) { // a trunk or the hut between camera and player? slide the camera in front of it
    if (!o.cam) continue;
    const along = (o.x - look.x) * ux + (o.z - look.z) * uz, side = Math.abs((o.x - look.x) * uz - (o.z - look.z) * ux);
    if (along > 0 && along < d * cp && side < o.r + 0.3 && (along - o.cam - 0.2) / cp > 3) d = (along - o.cam - 0.2) / cp;
  }
  tmpV.set(look.x + ux * cp * d, look.y + Math.sin(cam.pitch) * d, look.z + uz * cp * d);
  camera.position.lerp(tmpV, 1 - Math.exp(-dt * 8));
  const floor = Math.max(heightAt(camera.position.x, camera.position.z), 0.2) + 0.8;
  if (camera.position.y < floor) camera.position.y = floor;
  for (const o of obstacles) { // keep the camera out of trunks, canopies and the hut
    if (!o.cam) continue;
    let ox = o.x, oz = o.z;
    let rad = o.cam;
    if (o.lean) { const f = Math.min(Math.max((camera.position.y - o.y) / o.H, 0), 1) ** 2 * o.lean; ox += o.lx * f; oz += o.lz * f; if (Math.abs(camera.position.y - o.y - o.H + 0.4) < 2) rad = o.H * 0.55; }
    const dx = camera.position.x - ox, dz = camera.position.z - oz, d = Math.hypot(dx, dz) || 1e-4;
    if (d < rad) { camera.position.x = ox + (dx / d) * rad; camera.position.z = oz + (dz / d) * rad; }
  }
  camera.lookAt(look);
  sky.position.copy(camera.position);
  sun.position.copy(player.position).addScaledVector(sunDir, 70); sun.target.position.copy(player.position);
}
cam.yaw0 = cam.yaw - 1.1;

// === UI ===
const countEl = document.getElementById('count'), chip = document.getElementById('shells'), hint = document.getElementById('hint'), win = document.getElementById('win');
if (isTouch) { document.body.classList.add('touch'); document.getElementById('hintText').textContent = 'Left side to move · right side to look'; jumpBtn.style.display = 'grid'; }
let hintTimer = setTimeout(() => hideHint(), 9000);
function hideHint() { if (hintTimer === null) return; clearTimeout(hintTimer); hintTimer = null; setTimeout(() => hint.classList.add('hide'), 2500); }
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } };
const found = new Set(load(CONFIG.storageKey, []).filter((i) => i >= 0 && i < CONFIG.shells));
const pickedAt = new Float32Array(CONFIG.shells).fill(-10);
function renderCount(bump) {
  countEl.textContent = `${found.size} / ${CONFIG.shells}`; chip.classList.toggle('done', found.size === CONFIG.shells);
  if (bump) { chip.classList.add('bump'); setTimeout(() => chip.classList.remove('bump'), 260); }
}
function collect(i, t) {
  found.add(i); pickedAt[i] = t; save(CONFIG.storageKey, [...found]); renderCount(true);
  const s = shellSpots[i]; burst(s.x, s.h + 0.8, s.z, 46, ['#fff3b0', '#ffd0c2', '#ffffff', '#ffb38a'], 4.5); sfx.shell(found.size);
  if (found.size === CONFIG.shells) setTimeout(celebrate, 600);
}
function celebrate() {
  sfx.win(); win.classList.add('show');
  for (let k = 0; k < 5; k++) setTimeout(() => burst(player.position.x, player.position.y + 2, player.position.z, 60, ['#ff8fb1', '#ffd45c', '#7fe0ff', '#b9f27c', '#c9a7ff', '#ffffff'], 7), k * 280);
  orb?.store?.incr?.('island:finders').then((n) => { document.getElementById('winSub').textContent = `You're island explorer #${n}!`; }).catch(() => {});
}
document.getElementById('again').addEventListener('click', () => { found.clear(); save(CONFIG.storageKey, []); pickedAt.fill(-10); renderCount(true); win.classList.remove('show'); });
renderCount(false);
if (found.size === CONFIG.shells) setTimeout(() => win.classList.add('show'), 1500);

// --- sound: soft synthesized blips + a gentle ocean wash (after first gesture)
let actx = null, master = null, muted = load('island.muted', false);
const muteBtn = document.getElementById('mute'), waveIcon = document.getElementById('wave');
const renderMute = () => { waveIcon.style.opacity = muted ? 0.15 : 1; if (master) master.gain.value = muted ? 0 : 0.7; };
muteBtn.addEventListener('click', () => { unlockAudio(); muted = !muted; save('island.muted', muted); renderMute(); });
function unlockAudio() {
  if (actx) { if (actx.state === 'suspended' && !document.hidden) actx.resume(); return; }
  try {
    actx = new AudioContext(); master = actx.createGain(); master.connect(actx.destination); renderMute();
    const buf = actx.createBuffer(1, actx.sampleRate * 3, actx.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < d.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = actx.createBufferSource(), lp = actx.createBiquadFilter(), g = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
    src.buffer = buf; src.loop = true; lp.type = 'lowpass'; lp.frequency.value = 700; g.gain.value = 0.16; lfo.frequency.value = 0.11; lg.gain.value = 0.1;
    lfo.connect(lg).connect(g.gain); src.connect(lp).connect(g).connect(master); src.start(); lfo.start();
  } catch { actx = null; }
}
function blip(f, delay, dur, type, vol, f2) {
  if (!actx || muted) return; const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfx = {
  jump: () => blip(330, 0, 0.22, 'sine', 0.13, 660),
  bump: () => blip(200, 0, 0.18, 'sine', 0.1, 130),
  shell: (n) => { const f = 523 * 2 ** ((n * 2) / 12); blip(f, 0, 0.3, 'sine', 0.2); blip(f * 1.5, 0.07, 0.35, 'sine', 0.14); blip(f * 2, 0.14, 0.6, 'triangle', 0.08); },
  win: () => [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => blip(f, i * 0.11, 0.6, 'triangle', 0.14)),
};
document.addEventListener('visibilitychange', () => { if (!actx) return; if (document.hidden) actx.suspend(); else actx.resume(); });

function resize() {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 0.8 ? 62 : CONFIG.camera.fov; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  pMat.uniforms.uScale.value = (innerHeight * renderer.getPixelRatio()) / (2 * Math.tan((camera.fov * Math.PI) / 360));
}
addEventListener('resize', resize); resize();

// === LOOP ===
function updateWorld(dt, t) {
  cloudData.forEach((c, i) => { c.x += dt * 2.2; if (c.x > 300) c.x -= 600; dummy.position.set(c.x, c.y, c.z); dummy.rotation.set(0, c.ry, 0); dummy.scale.setScalar(c.s); dummy.updateMatrix(); clouds.setMatrixAt(i, dummy.matrix); });
  clouds.instanceMatrix.needsUpdate = true;
  for (const b of birds) {
    const a = t * b.sp + b.ph; b.g.position.set(CONFIG.hill.x + Math.cos(a) * b.rad, b.y + Math.sin(t * 0.7 + b.ph) * 1.5, CONFIG.hill.z + Math.sin(a) * b.rad);
    b.g.rotation.set(0, -a + (b.sp > 0 ? Math.PI : 0), Math.sign(b.sp) * 0.25);
    const flap = Math.sin(t * 9 + b.ph) * 0.55; b.l.rotation.z = flap; b.r.rotation.z = -flap;
  }
  const pp = player.position;
  for (let i = 0; i < CONFIG.shells; i++) {
    const s = shellSpots[i], age = t - pickedAt[i], got = found.has(i), k = got ? Math.max(0, 1 - age / 0.6) : 1;
    const y = s.h + 0.5 + Math.sin(t * 2 + i) * 0.12 + (got ? (1 - k) * 2.5 : 0);
    dummy.position.set(s.x, y, s.z); dummy.rotation.set(-0.55, t * 1.3 + i, 0); dummy.scale.setScalar(1.15 * k * (1 + (1 - k) * 0.8)); dummy.updateMatrix(); shells.setMatrixAt(i, dummy.matrix);
    dummy.position.set(s.x, s.h - 0.2, s.z); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, got ? 0 : 1, 1); dummy.updateMatrix(); beams.setMatrixAt(i, dummy.matrix);
    pPos.set([s.x, y + 0.55, s.z], i * 3); pCol.set([1, 0.93, 0.7], i * 3); pSize[i] = got ? 0 : 0.7 + Math.sin(t * 5 + i * 2) * 0.35;
    if (!got && (pp.x - s.x) ** 2 + (pp.z - s.z) ** 2 < 1.6 && Math.abs(pp.y + 0.6 - y) < 1.8) collect(i, t);
  }
  shells.instanceMatrix.needsUpdate = beams.instanceMatrix.needsUpdate = true;
  for (let i = MOTE0; i < BURST0; i++) { // pollen motes drifting around the player
    const j = i * 3, ph = i * 1.37;
    pPos[j] += Math.sin(t * 0.3 + ph) * dt * 0.4; pPos[j + 1] += Math.sin(t * 0.5 + ph * 2) * dt * 0.25; pPos[j + 2] += Math.cos(t * 0.3 + ph) * dt * 0.4;
    if (pPos[j] - pp.x > 14) pPos[j] -= 28; if (pPos[j] - pp.x < -14) pPos[j] += 28;
    if (pPos[j + 2] - pp.z > 14) pPos[j + 2] -= 28; if (pPos[j + 2] - pp.z < -14) pPos[j + 2] += 28;
    const gy = Math.max(0, heightAt(pPos[j], pPos[j + 2])); if (pPos[j + 1] < gy + 0.4 || pPos[j + 1] > gy + 7) pPos[j + 1] = gy + rr(1, 5);
    pCol[j] = 1; pCol[j + 1] = 0.95; pCol[j + 2] = 0.75; pSize[i] = 0.16 + 0.1 * Math.sin(t * 2 + ph);
  }
  for (let i = BURST0; i < PMAX; i++) {
    if (pLife[i] <= 0) { pSize[i] = 0; continue; }
    const j = i * 3; pLife[i] -= dt; pVel[j + 1] -= 7 * dt;
    pPos[j] += pVel[j] * dt; pPos[j + 1] += pVel[j + 1] * dt; pPos[j + 2] += pVel[j + 2] * dt;
    pSize[i] = 0.5 * Math.max(0, pLife[i] / pTTL[i]);
  }
  for (const n of ['position', 'aColor', 'aSize']) pGeo.attributes[n].needsUpdate = true;
}
let captured = false;
renderer.setAnimationLoop(() => {
  timer.update();
  const dt = Math.min(timer.getDelta(), 1 / 20), t = timer.getElapsed();
  uTime.value = t;
  updatePlayer(dt, t); updateCamera(dt); updateWorld(dt, t);
  renderer.render(scene, camera);
  if (!captured && t > 4) { captured = true; orb?.capture?.(); }
});
</script>
